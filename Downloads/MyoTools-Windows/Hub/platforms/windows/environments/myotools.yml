# MyoSeg + MyoClass - Windows 10/11 x86_64 (Conda / Miniforge)
# Cellpose 3 + napari 0.9.2 with PySide6 (NOT PyQt6).
# Includes a CUDA-enabled PyTorch build with automatic CPU fallback.
# Requires a working desktop graphics driver for the napari reviewer.
# Conda is deliberately kept minimal to avoid mixing Qt/OpenGL libraries
# from Conda with Qt bundled by the PySide6 pip wheels.
# Candidate Windows environment: installation and image workflows still need testing.

name: myotools
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip
  # Native MSVC runtime for compiled microscopy/image packages on Windows.
  - vs2015_runtime
  - pip:
      # Official CUDA 12.6 PyTorch wheel; works on CPU-only computers too.
      # NVIDIA acceleration requires compatible hardware and a recent driver.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126

      # Keep NumPy 1.x for Cellpose 3 and the older CZI stack.
      - numpy==1.26.4

      # Cellpose v3 is required; do not upgrade to Cellpose v4.
      - cellpose==3.1.1.3
      - opencv-python-headless==4.11.0.86

      # Napari GUI: use the same PySide6 stack that worked on Linux.
      # Avoid napari[all], PyQt6, and Conda Qt/OpenGL packages.
      - napari[pyside6]==0.9.2
      - PySide6==6.10.2
      - qtpy>=2.4,<3

      # CZI / OME-TIFF reader: preserve the legacy AICSImageIO dependency set.
      - aicsimageio==4.14.0
      - aicspylibczi==4.0.1
      - tifffile==2023.2.28
      - fsspec==2023.6.0
      - zarr==2.15.0
      - numcodecs==0.15.1
      - ome-zarr==0.9.0
      - dask==2023.7.1
      - distributed==2023.7.1
      - xarray==2023.10.1

      # Voila / Jupyter and MyoClass review Excel files.
      - voila==0.5.13
      - ipywidgets>=8,<9
      - ipyfilechooser==0.6.0
      - ipykernel>=6,<8
      - openpyxl>=3.1,<4

      # Scientific processing and image measurement.
      - pandas>=2.2,<3
      - scipy>=1.14,<1.18
      - scikit-image>=0.25,<0.27
      - pillow>=10,<13

# Ensures qtpy selects PySide6 in Voilà and in the napari subprocess.
variables:
  QT_API: pyside6
